<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Cherry 관리자페이지 - 체험 관리</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --topbar-h: 64px;
            --sidebar-w: 180px;
            --logo-w: 140px;
            --g150: #f2f3f4;
            --g200: #e9ecef;
            --g300: #dee2e6;
            --g600: #434343;
        }

        /* Top bar */
        .topbar {
            height: var(--topbar-h);
            background: var(--g600);
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, .06);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: .5rem;
            text-decoration: none
        }

        .brand-logo svg {
            width: var(--logo-w);
            height: auto;
            display: block
        }

        .brand-sub {
            font-size: .9rem;
            color: rgba(255, 255, 255, .6)
        }

        .logout-btn {
            border-color: transparent;
            color: #fff
        }

        /* Layout */
        .layout {
            display: grid;
            grid-template-columns:var(--sidebar-w) 1fr;
            grid-template-areas:"sidebar main";
            min-height: calc(100vh - var(--topbar-h));
        }

        /* Sidebar */
        .sidebar {
            grid-area: sidebar;
            background: #eeeeee;
            border-right: 1px solid var(--g300);
            padding: 16px 12px;
        }

        .nav-group-title {
            font-weight: 700;
            color: #444;
            margin: 6px 8px 16px
        }

        .side-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 10px;
            color: #555;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600
        }

        .side-link .bi {
            font-size: 20px;
            width: 24px;
            text-align: center;
            opacity: .85
        }

        .side-link:hover {
            background: #e6e6e6;
            color: #222
        }

        .side-link.active {
            background: #d6d6d6;
            color: #222
        }

        /* Main */
        .main {
            grid-area: main;
            padding: 24px;
            background: #fff
        }

        .filter-bar {
            background: var(--g150);
            border: 1px solid var(--g300);
            border-radius: 8px;
            padding: 14px
        }

        .table-head-like {
            background: #6b6b6b;
            color: #fff;
            font-weight: 700;
            border-radius: 6px 6px 0 0;
            padding: 10px 12px
        }

        .boxed-table {
            border: 1px solid var(--g300);
            border-top: 0;
            border-radius: 0 0 6px 6px;
            overflow: hidden
        }

        .table > :not(caption) > * > * {
            vertical-align: middle
        }

        .empty-rows {
            height: 48px;
            background: #f7f7f7
        }

        /* pager */
        .mini-pager {
            display: flex;
            gap: 18px;
            align-items: center;
            justify-content: center;
            padding: 12px
        }

        .mini-pager .bi {
            font-size: 16px
        }
    </style>
</head>
<body class="bg-white">

        <div class="d-flex align-items-center gap-2">
            <form th:action="@{/admin/logout}" method="post" class="ms-2">
                <button type="submit" class="btn btn-sm logout-btn">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<!-- BODY -->
<div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="nav-group-title">관리</div>
        <nav class="d-flex flex-column">
            <a class="side-link" th:href="@{/admin}">
                <i class="bi bi-headset"></i><span class="label">제품관리</span>
            </a>
            <a class="side-link" th:href="@{/admin/members}">
                <i class="bi bi-person"></i><span class="label">회원관리</span>
            </a>
            <a class="side-link active" th:href="@{/admin/rentals}">
                <i class="bi bi-globe2"></i><span class="label">체험관리</span>
            </a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>체험 관리</h4>
        </div>
        <form class="filter-bar mb-3" method="get" th:action="@{/admin/rentals}">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label for="orderNumber" class="form-label">주문번호</label>
                    <input id="orderNumber" name="orderNumber" type="text" class="form-control"
                           placeholder="주문번호 검색"
                           th:value="${orderNumber}">
                </div>
                <div class="col-md-4">
                    <label for="startDate" class="form-label">체험신청일시</label>
                    <div class="input-group">
                        <input id="startDate" name="startDate" type="date" class="form-control" th:value="${startDate}">
                        <span class="input-group-text">~</span>
                        <input id="endDate" name="endDate" type="date" class="form-control" th:value="${endDate}">
                    </div>
                </div>
                <div class="col-md-4 text-end">
                    <button type="submit" class="btn btn-dark btn-sm px-3">검색</button>
                </div>
            </div>
        </form>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">순번</th>
                    <th scope="col">체험신청일시</th>
                    <th scope="col">주문번호</th>
                    <th scope="col">체험상태</th>
                    <th scope="col">리포트 작성상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rental, stat : ${rentals}">
                    <td th:text="${#numbers.formatInteger(stat.count, 2)}">01</td>
                    <td th:text="${#temporals.format(rental.detail.createdAt, 'yyyy.MM.dd HH:mm:ss')}">2025.09.04 09:00:10</td>
                    <td>
                        <a th:href="@{'/admin/rentals/' + ${rental.id}}" th:text="${rental.rentalNumber}">-</a>
                    </td>
                    <td th:text="${rental.rentalStatus}">-</td>
                    <td th:text="${rental.reviewStatus}">-</td>
                </tr>

                <!-- 데이터가 없을 때 -->
                <tr th:if="${#lists.isEmpty(rentals)}">
                    <td colspan="5" class="text-center text-muted py-4">등록된 체험이 없습니다.</td>
                </tr>
                </tbody>
            </table>

        <!-- 페이지네이션 -->
        <nav th:if="${page != null and page.totalPages > 0}" aria-label="Rental pages" class="mt-2">
            <ul class="pagination pagination-sm justify-content-center mb-0">
                <!-- 맨앞 -->
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admin/rentals(page=${0}, size=${page.size}, orderNumber=${orderNumber}, startDate=${startDate}, endDate=${endDate})}"
                       aria-label="First">&laquo;</a>
                </li>

                <!-- 이전 -->
                <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admin/rentals(page=${page.number - 1}, size=${page.size}, orderNumber=${orderNumber}, startDate=${startDate}, endDate=${endDate})}"
                       aria-label="Previous">&lsaquo;</a>
                </li>

                <!-- 번호들 -->
                <li class="page-item"
                    th:each="p : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${p == page.number} ? 'active'">
                    <a class="page-link"
                       th:text="${p + 1}"
                       th:href="@{/admin/rentals(page=${p}, size=${page.size}, orderNumber=${orderNumber}, startDate=${startDate}, endDate=${endDate})}">
                        1
                    </a>
                </li>

                <!-- 다음 -->
                <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admin/rentals(page=${page.number + 1}, size=${page.size}, orderNumber=${orderNumber}, startDate=${startDate}, endDate=${endDate})}"
                       aria-label="Next">&rsaquo;</a>
                </li>

                <!-- 맨뒤 -->
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admin/rentals(page=${page.totalPages - 1}, size=${page.size}, orderNumber=${orderNumber}, startDate=${startDate}, endDate=${endDate})}"
                       aria-label="Last">&raquo;</a>
                </li>
            </ul>
        </nav>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
