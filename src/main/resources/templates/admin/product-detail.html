<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Cherry 관리자페이지 - 제품 상세</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <!-- CSRF (있으면 렌더) -->
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .thumb {
            border: 1px solid #dee2e6;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }

        .thumb img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
        }

        .long-detail {
            margin: 0;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 10px;
            background: #fff;
        }

        .long-detail img {
            width: 100%;
            max-width: 720px; /* 최대 폭 제한 */
            height: auto;
            display: block;
            border-radius: 6px;
            margin: 0 auto;
        }

        .long-detail figcaption {
            margin-top: 6px;
            font-size: 0.85rem;
            color: #555;
            text-align: center;
        }

        .product-main-image {
            max-width: 400px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .hero img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }

        .kv {
            display: grid;
            grid-template-columns:140px 1fr;
            gap: 8px;
        }

        @media (max-width: 576px) {
            .kv {
                grid-template-columns:1fr;
            }
        }

        .muted {
            color: #6c757d;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0">제품 상세보기</h4>
        <div class="d-flex gap-2">
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">목록으로</a>
            <button type="button" id="deleteBtn" class="btn btn-danger btn-sm">상품 제거</button>
        </div>
    </div>

    <!-- 상단 요약 -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3 align-items-center">
                <div class="col-lg-5">
                    <!-- 대표 썸네일: product.thumbnailUrl -->
                    <img th:src="|https://cherry-dev-assets.s3.ap-northeast-2.amazonaws.com/${product.thumbnailUrl}|" alt="대표 썸네일" class="img-fluid product-main-image">
                </div>
                <div class="col-lg-7">
                    <div class="kv">
                        <div class="fw-bold">제품명</div>
                        <div th:text="${product.name}">제품명</div>

                        <div class="fw-bold">브랜드</div>
                        <div th:text="${product.brand}">SONY</div>

                        <div class="fw-bold">하루체험금액</div>
                        <div>
                            <span th:text="${#numbers.formatInteger(product.dailyRentalPrice, 3, 'COMMA')}">5,000</span>
                            원
                        </div>

                        <div class="fw-bold">출시일</div>
                        <div th:text="${#temporals.format(product.launchedAt, 'yyyy.MM.dd')}">2025.09.04</div>

                        <div class="fw-bold">등록일시</div>
                        <div class="muted"
                             th:text="${#temporals.format(product.detail.registeredAt, 'yyyy.MM.dd HH:mm')}">2025.09.07
                            10:33
                        </div>

                        <div class="fw-bold">색상 옵션</div>
                        <div>
              <span class="badge bg-dark me-1"
                    th:each="c : ${product.colors}"
                    th:text="${c}">BLACK</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 썸네일 이미지 리스트 (정렬된 순서대로) -->
    <div class="card mb-3">
        <div class="card-body">
            <h6 class="fw-bold mb-2">이미지</h6>
            <div class="grid">
                <div class="thumb"
                     th:each="detail, idxStat : ${product.detail.productThumbnailDetails}">
                    <img th:src="|https://cherry-dev-assets.s3.ap-northeast-2.amazonaws.com/${detail.imageUrl}|" alt="상세">
                    <div class="p-2 small text-muted">#<span th:text="${idxStat.index + 1}">1</span></div>
                </div>
            </div>
            <div class="mt-2 small text-muted">저장 순서대로 표시됩니다.</div>
        </div>
    </div>

    <section class="card mt-3">
        <div class="card-body">
            <h6 class="fw-bold mb-3">상세 이미지</h6>

            <div id="long-detail-list" class="d-flex flex-column gap-4"
                 th:if="${product != null and product.detail != null}">

                <!-- 상세 이미지 반복 -->
                <figure class="long-detail"
                        th:each="detail, iterStat : ${product.detail.productImageDetails}">
                    <img th:src="|https://cherry-dev-assets.s3.ap-northeast-2.amazonaws.com/${detail.imageUrl}|"
                         alt="상세 이미지"
                         loading="lazy"
                         decoding="async">
                    <figcaption>#<span th:text="${iterStat.count}"></span></figcaption>
                </figure>

                <!-- 비어 있을 때 -->
                <div class="text-muted"
                     th:if="${#lists.isEmpty(product.detail.productImageDetails)}">
                    등록된 상세 이미지가 없습니다.
                </div>
            </div>
        </div>
    </section>

</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    // CSRF
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

    const productId = /*[[${product.id}]]*/ null;
    const deleteBtn = document.getElementById('deleteBtn');

    if (deleteBtn && productId) {
        deleteBtn.addEventListener('click', () => {
            if (!confirm('정말로 이 상품을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) {
                return;
            }

            const headers = {};
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }

            fetch(`/api/v1/product/${productId}`, {
                method: 'DELETE',
                headers: headers
            })
                .then(response => {
                    if (response.status === 204) {
                        alert('상품이 성공적으로 삭제되었습니다.');
                        window.location.href = '/admin';
                    } else {
                        return response.text().then(text => {
                            throw new Error(text || `Error: ${response.status}`);
                        });
                    }
                })
                .catch(error => {
                    console.error('Delete failed:', error);
                    alert('상품 삭제에 실패했습니다: ' + error.message);
                });
        });
    }
    /*]]>*/
</script>
</body>
</html>
